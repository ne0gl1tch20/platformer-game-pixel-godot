name: Godot Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and headless startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7-stable
          use-dotnet: false

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run game startup
        run: godot --headless --path . --quit-after 120
