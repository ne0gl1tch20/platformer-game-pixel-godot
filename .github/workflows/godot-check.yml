name: Godot Production Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: C# build and headless startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Set up Godot 4.7 .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: true
          include-templates: true

      - name: Generate C# solution
        run: godot --headless --path . --build-solutions --quit || true

      - name: Restore and build C#
        run: dotnet build PlatformerGamePixel.csproj --configuration Release

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run game startup
        run: godot --headless --path . --quit-after 120
